name: Actualiser le catalogue AniTrack

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/import_catalog.py"
      - ".github/workflows/update-catalog.yml"
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: anitrack-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le catalogue hors ligne pour le site
        run: python scripts/import_catalog.py
      - name: Publier le catalogue actualisé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "Le catalogue est déjà à jour."
            exit 0
          fi
          git commit -m "Actualisation automatique du catalogue AniTrack"
          git push origin HEAD:main
